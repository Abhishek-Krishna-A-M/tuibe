[project]
name = "ytmusic-cli"
version = "0.1.0"
description = "TUI YouTube Music player"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "ytmusicapi>=1.0.0",
    "mpv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
ytmusic-cli = "ytmusic_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["ytmusic_cli*"]

[tool.setuptools.package-data]
ytmusic_cli = ["css/*.tcss"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
